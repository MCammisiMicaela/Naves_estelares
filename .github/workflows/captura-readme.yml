name: Generar captura para README
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/captura-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para la captura
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capturar Naves Estelares
        run: |
          mkdir -p capturas
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1343, height: 600 },
              deviceScaleFactor: 1
            });
            await page.goto('https://mcammisimicaela.github.io/Naves_estelares/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('.starship-card').first().waitFor({ state: 'visible', timeout: 60000 });
            await page.locator('#estado').getByText('Catálogo cargado correctamente.').waitFor({ timeout: 60000 });
            await page.screenshot({ path: 'capturas/naves-estelares-home.png', fullPage: false });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Guardar imagen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas/naves-estelares-home.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: agregar captura de Naves Estelares"
            git push
          fi
